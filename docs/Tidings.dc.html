<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/broadsheet-96485b77-d420-4fb6-bd2e-208f26c4ab3a/styles.css">
  <script src="_ds/broadsheet-96485b77-d420-4fb6-bd2e-208f26c4ab3a/_ds_bundle.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <script src="./image-slot.js"></script>
  <style>
    html, body { margin: 0; background: var(--color-bg); }
    a { color: var(--color-accent); }
    a:hover { color: var(--color-accent-600); }
    @keyframes tdCaret { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes tdRise { from { transform: translateY(34px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes tdFlip { 0% { transform: scaleX(1); } 50% { transform: scaleX(0.02); } 100% { transform: scaleX(1); } }
    @keyframes tdFade { from { opacity: 0; } to { opacity: 1; } }
    textarea::placeholder { color: color-mix(in srgb, currentColor 30%, transparent); }
    textarea, select, input { font: inherit; color: inherit; }
    select { -webkit-appearance: none; appearance: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 18%, transparent); }
    ::-webkit-scrollbar-track { background: transparent; }
    image-slot { --slot-bg: transparent; }
  </style>
</helmet>

<div style="{{ shellStyle }}">

  <sc-if value="{{ deskImgStyle }}">
    <div style="{{ deskImgStyle }}"></div>
  </sc-if>
  <sc-if value="{{ deskSlot }}">
    <div style="position: fixed; inset: 0; z-index: 0;">
      <image-slot id="tidings-desk" shape="rect" fit="cover" placeholder="Drop an HD backdrop"></image-slot>
    </div>
  </sc-if>

  <div style="display: flex; align-items: baseline; gap: 18px; padding: 22px 26px 0; z-index: 20;">
    <button type="button" onClick="{{ restart }}" title="Tidings" style="{{ markStyle }}" style-hover="color: var(--color-accent);">Tidings</button>
    <sc-if value="{{ backWord }}">
      <button type="button" onClick="{{ back }}" style="{{ quietStyle }}" style-hover="color: var(--color-accent);">{{ backWord }}</button>
    </sc-if>
    <span style="margin-left: auto;"></span>
    <sc-if value="{{ topRight }}">
      <span style="{{ topRightStyle }}">{{ topRight }}</span>
    </sc-if>
  </div>

  <div ref="{{ fieldRef }}" style="{{ fieldStyle }}">

    <sc-if value="{{ isS1 }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: clamp(38px, 8vw, 110px); width: 100%; height: 100%; padding: 8px 26px 0; animation: tdFade 700ms ease both;">
      <button type="button" onClick="{{ pickLetterPath }}" style="display: flex; flex-direction: column; align-items: center; gap: 20px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: transform 320ms cubic-bezier(.2,.7,.2,1);" style-hover="transform: translateY(-10px);">
        <img src="assets/sm/paper-stack.png" alt="A letter on a stack of paper" style="width: clamp(150px, 19vw, 260px); transform: rotate(-2.4deg); filter: drop-shadow(0 22px 30px color-mix(in srgb, #201e1d 17%, transparent)) drop-shadow(0 2px 4px color-mix(in srgb, #201e1d 13%, transparent));">
        <span style="font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;">write a letter</span>
      </button>
      <button type="button" onClick="{{ pickTypewriterPath }}" style="display: flex; flex-direction: column; align-items: center; gap: 20px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: transform 320ms cubic-bezier(.2,.7,.2,1);" style-hover="transform: translateY(-10px);">
        <img src="assets/tw/tw-burgundy.png" alt="A burgundy portable typewriter" style="width: clamp(230px, 34vw, 470px); filter: drop-shadow(0 26px 30px color-mix(in srgb, #201e1d 20%, transparent)) drop-shadow(0 3px 5px color-mix(in srgb, #201e1d 16%, transparent));">
        <span style="font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;">use the typewriter</span>
      </button>
    </div>
    </sc-if>

    <sc-if value="{{ isS2 }}">
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: clamp(30px, 6vw, 84px); width: 100%; height: 100%; padding: 8px 26px 0; animation: tdFade 520ms ease both;">
      <button type="button" onClick="{{ pickDiary }}" style="display: flex; flex-direction: column; align-items: center; gap: 18px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: transform 320ms cubic-bezier(.2,.7,.2,1);" style-hover="transform: translateY(-10px);">
        <img src="assets/diary/d-green-blank.png" alt="An open notebook" style="width: clamp(210px, 30vw, 430px); filter: drop-shadow(0 24px 30px color-mix(in srgb, #201e1d 18%, transparent)) drop-shadow(0 3px 5px color-mix(in srgb, #201e1d 13%, transparent));">
        <span style="font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;">a diary</span>
      </button>
      <button type="button" onClick="{{ pickPage }}" style="display: flex; flex-direction: column; align-items: center; gap: 18px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: transform 320ms cubic-bezier(.2,.7,.2,1);" style-hover="transform: translateY(-10px);">
        <img src="assets/sm/paper-stack.png" alt="A letter on writing paper" style="width: clamp(150px, 18vw, 250px); transform: rotate(1.8deg); filter: drop-shadow(0 20px 28px color-mix(in srgb, #201e1d 16%, transparent)) drop-shadow(0 2px 4px color-mix(in srgb, #201e1d 12%, transparent));">
        <span style="font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;">a letter</span>
      </button>
      <button type="button" onClick="{{ pickPostcard }}" style="display: flex; flex-direction: column; align-items: center; gap: 18px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; transition: transform 320ms cubic-bezier(.2,.7,.2,1);" style-hover="transform: translateY(-10px);">
        <img src="assets/paper/pc-airmail-front.jpg" alt="A post card" style="width: clamp(170px, 22vw, 290px); transform: rotate(-1.4deg); box-shadow: 0 20px 30px color-mix(in srgb, #201e1d 16%, transparent), 0 2px 5px color-mix(in srgb, #201e1d 12%, transparent);">
        <span style="font-size: 12.5px; letter-spacing: 0.2em; text-transform: uppercase;">a post card</span>
      </button>
    </div>
    </sc-if>

    <sc-if value="{{ isDesk }}">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; width: 100%; min-height: 100%; padding: 6px 26px 10px;">

      <sc-if value="{{ askEnvelope }}">
        <div style="display: flex; align-items: baseline; gap: 20px; animation: tdFade 400ms ease both;">
          <span style="font-size: 15px; font-style: italic;">Shall it travel in an envelope?</span>
          <button type="button" onClick="{{ envYes }}" style="background: none; border: 0; padding: 0; cursor: pointer; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-accent);" style-hover="color: var(--color-accent-600);">yes</button>
          <button type="button" onClick="{{ envNo }}" style="{{ quietStyle }}">no, just send it</button>
        </div>
      </sc-if>

      <sc-if value="{{ showLetter }}">
      <div ref="{{ surfRef }}" onClick="{{ surfaceClick }}" style="{{ surfaceStyle }}">
        <div style="position: absolute; inset: 0; overflow: hidden;">
          <div style="{{ paperImgStyle }}"></div>
        </div>

        <sc-if value="{{ paper.margin }}">
          <div style="{{ marginRuleStyle }}"></div>
        </sc-if>
        <sc-if value="{{ drawnRules }}">
          <div style="{{ rulesStyle }}"></div>
        </sc-if>
        <sc-if value="{{ cardLines }}">
          <div style="{{ cardDividerStyle }}"></div>
          <div style="{{ cardAddressStyle }}">
            <span style="display: block; height: 1px; background: color-mix(in srgb, var(--color-text) 30%, transparent); margin-bottom: 16%;"></span>
            <span style="display: block; height: 1px; background: color-mix(in srgb, var(--color-text) 30%, transparent); margin-bottom: 16%;"></span>
            <span style="display: block; height: 1px; background: color-mix(in srgb, var(--color-text) 30%, transparent);"></span>
          </div>
        </sc-if>

        <sc-if value="{{ editable }}">
          <div ref="{{ writeRef }}" contentEditable="{{ true }}" suppressContentEditableWarning="{{ true }}" onInput="{{ onWrite }}" spellCheck="{{ spell }}" data-text="1" style="{{ writeStyle }}"></div>
        </sc-if>
        <sc-if value="{{ readOnly }}">
          <div data-text="1" style="{{ readStyle }}">{{ shownText }}</div>
        </sc-if>

        <sc-for list="{{ stickers }}" as="s" hint-placeholder-count="0">
          <img src="{{ s.src }}" alt="" draggable="false" onPointerDown="{{ s.grab }}" onDoubleClick="{{ s.remove }}" style="{{ s.style }}">
        </sc-for>

        <sc-for list="{{ polaroids }}" as="p" hint-placeholder-count="0">
          <div style="{{ p.frameStyle }}">
            <div onPointerDown="{{ p.grab }}" style="{{ p.gripStyle }}"></div>
            <div style="{{ p.photoStyle }}">
              <image-slot id="{{ p.slotId }}" shape="rect" fit="cover" src="{{ p.src }}" placeholder="drop a photo"></image-slot>
            </div>
            <input value="{{ p.caption }}" onChange="{{ p.setCaption }}" maxLength="30" placeholder="write something" style="{{ p.captionStyle }}">
          </div>
        </sc-for>

        <sc-if value="{{ signature }}">
          <div style="{{ sigStyle }}">
            <image-slot id="tidings-signature" shape="rect" fit="contain" placeholder="Drop your signature"></image-slot>
          </div>
        </sc-if>
      </div>
      </sc-if>

      <sc-if value="{{ showEnvelope }}">
      <div style="{{ envWrapStyle }}">
        <div onClick="{{ envelopeClick }}" style="{{ envStyle }}">
          <sc-if value="{{ envImgStyle }}">
            <div role="img" aria-label="An envelope" style="{{ envImgStyle }}"></div>
          </sc-if>
          <sc-if value="{{ envFlapStyle }}">
            <div style="{{ envFlapStyle }}"></div>
          </sc-if>
          <sc-if value="{{ envAddrStyle }}">
            <div style="{{ envAddrStyle }}">
              <div style="font-size: 0.9em; font-style: italic; opacity: 0.5; margin-bottom: 7px;">to</div>
              <div style="height: 1px; background: color-mix(in srgb, #201e1d 34%, transparent); margin-bottom: 12px;"></div>
              <div style="height: 1px; background: color-mix(in srgb, #201e1d 34%, transparent); margin-bottom: 12px;"></div>
              <div style="height: 1px; background: color-mix(in srgb, #201e1d 34%, transparent); width: 62%;"></div>
            </div>
          </sc-if>
          <sc-if value="{{ envStamp }}">
            <img src="{{ envStamp.img }}" alt="Stamp" style="{{ envStampStyle }}">
          </sc-if>
          <sc-if value="{{ envSealStyle }}">
            <img src="{{ envSealSrc }}" alt="Wax seal" style="{{ envSealStyle }}">
          </sc-if>
        </div>
      </div>
      </sc-if>

      <sc-if value="{{ centreHint }}">
        <div style="{{ hintStyle }}">{{ centreHint }}</div>
      </sc-if>
    </div>
    </sc-if>

    <sc-if value="{{ isTypewriter }}">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; height: 100%; padding: 4px 20px 0;">
      <div style="{{ twAssemblyStyle }}">
        <div style="{{ sheetStyle }}">
          <div style="{{ twSheetStyle }}"></div>
          <sc-if value="{{ isS6 }}">
            <textarea ref="{{ twRef }}" value="{{ twText }}" onChange="{{ setTwText }}" spellCheck="{{ spell }}" placeholder="Type. The machine follows." style="{{ twWriteStyle }}"></textarea>
          </sc-if>
          <sc-if value="{{ isS7 }}">
            <div style="{{ twReadStyle }}">{{ twText }}</div>
          </sc-if>
          <sc-if value="{{ feedShadeStyle }}">
            <div style="{{ feedShadeStyle }}"></div>
          </sc-if>
        </div>
        <sc-if value="{{ isS6 }}">
        <div style="{{ machineWrapStyle }}">
          <div role="img" aria-label="A typewriter" style="{{ machineStyle }}"></div>
          <sc-for list="{{ keyMarks }}" as="k" hint-placeholder-count="0">
            <span style="{{ k.style }}"></span>
          </sc-for>
        </div>
        </sc-if>
      </div>
    </div>
    </sc-if>

    <sc-if value="{{ hand }}">
      <img src="{{ hand.src }}" alt="" draggable="false" style="{{ handStyle }}">
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 26px 18px; z-index: 20;">

    <sc-if value="{{ drawerTitle }}">
    <div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0;">
      <span style="{{ drawerTitleStyle }}">{{ drawerTitle }}</span>
      <span style="{{ drawerNoteStyle }}">{{ drawerNote }}</span>
      <sc-for list="{{ drawerTabs }}" as="t" hint-placeholder-count="0">
        <button type="button" onClick="{{ t.go }}" title="{{ t.title }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
    </sc-if>

    <sc-if value="{{ drawer }}">
    <div style="{{ drawerStyle }}">
      <sc-for list="{{ drawerItems }}" as="d" hint-placeholder-count="8">
        <button type="button" onClick="{{ d.pick }}" onPointerDown="{{ d.grab }}" title="{{ d.title }}" style="{{ d.style }}" style-hover="transform: translateY(-5px);">
          <img src="{{ d.src }}" alt="" draggable="false" style="{{ d.imgStyle }}">
          <sc-if value="{{ d.label }}">
            <span style="{{ d.labelStyle }}">{{ d.label }}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
    </sc-if>

    <sc-if value="{{ showColours }}">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap;">
      <sc-for list="{{ envColours }}" as="c" hint-placeholder-count="6">
        <span onClick="{{ c.pick }}" title="{{ c.title }}" style="{{ c.style }}"></span>
      </sc-for>
      <input type="color" value="{{ envColour }}" onChange="{{ setEnvColour }}" title="Any colour" style="width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer;">
      <span style="width: 14px;"></span>
      <sc-for list="{{ stamps }}" as="s" hint-placeholder-count="3">
        <img src="{{ s.img }}" alt="{{ s.title }}" draggable="false" onClick="{{ s.pick }}" title="{{ s.title }}" style="{{ s.style }}">
      </sc-for>
      <select value="{{ country }}" onChange="{{ setCountry }}" style="{{ selectStyle }}">
        <sc-for list="{{ countries }}" as="c" hint-placeholder-count="4">
          <option value="{{ c }}">{{ c }}</option>
        </sc-for>
      </select>
    </div>
    </sc-if>

    <div style="display: flex; align-items: baseline; gap: 17px; flex-wrap: wrap;">
      <sc-for list="{{ words }}" as="w" hint-placeholder-count="0">
        <button type="button" onClick="{{ w.go }}" title="{{ w.title }}" style="{{ w.style }}">{{ w.label }}</button>
      </sc-for>
      <sc-if value="{{ showFormats }}">
        <select value="{{ format }}" onChange="{{ setFormat }}" style="{{ selectStyle }}">
          <sc-for list="{{ formats }}" as="f" hint-placeholder-count="8">
            <option value="{{ f }}">{{ f }}</option>
          </sc-for>
        </select>
      </sc-if>
      <sc-if value="{{ counter }}">
        <span style="{{ counterStyle }}">{{ counter }}</span>
      </sc-if>
      <span style="flex: 1;"></span>
    </div>
  </div>

  <input type="file" ref="{{ fileRef }}" accept=".txt,.md,text/plain" onChange="{{ readFile }}" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;wordLimit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:700,&quot;min&quot;:50,&quot;max&quot;:2000,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;letterInk&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#201e1d&quot;,&quot;options&quot;:[&quot;#201e1d&quot;,&quot;#2f3d46&quot;,&quot;#4a2c22&quot;,&quot;#5a5754&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Letter&quot;}}">

const BG = 'uploads/backgrounds/';

The rain came in off the sea this morning and did not stop, so I stayed in and wrote to you instead of going out. There is a particular kind of quiet that only arrives with weather, and I wanted to hand you some of it.

I have been keeping the small things for you: the bakery on the corner that opens at six, the tram that never quite comes on time, the way the light lands on the kitchen table at four. None of it is news. All of it is yours.

Write back when you can. I will keep the kettle on.

Yours,
Rae`;

`;

        clearTimeout(this.keyT);
        this.keyT = setTimeout(() => this.setState({ pressed: null }), 200);
      }
    };
    window.addEventListener('keydown', this.onKey);
    this.syncDoc();
  }

  // the writing surface is an uncontrolled contentEditable so it can carry
  // real columns and keep the caret; push text in only when the sheet changes
  docKey() {
    const s = this.state;
    return [s.medium, s.paperId, s.sheetIdx, s.side, s.docSeq, s.screen, s.fontId].join('|');
  }

  syncDoc() {
    const el = this.writeRef.current;
    const key = this.docKey();
    if (!el) { this._docKey = null; return; }
    if (this._docKey === key) return;
    this._docKey = key;
    el.innerText = this.activeText();
  }

  componentDidUpdate() {
    this.syncDoc();
    // a fixed-height multi-column box overflows along the INLINE axis, so a full
    // diary spread grows scrollWidth, not scrollHeight: test both, on whichever
    // text element this screen has (the editor on 3, the read-only copy on 4/5)
    const surf = this.surfRef.current;
    const el = surf && surf.querySelector('[data-text]');
    const full = !!el && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2);
    if (full !== this.state.full) this.setState({ full });
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKey);
    clearTimeout(this.keyT);
  }

  limit() { return (this.props && this.props.wordLimit) || 700; }
  paper() { const l = SURFACES[this.state.medium]; return l.find(p => p.id === this.state.paperId) || l[0]; }
  font() { return FONTS.find(f => f.id === this.state.fontId) || FONTS[0]; }
  envelope() { return ENVELOPES.find(e => e.id === this.state.envId) || ENVELOPES[0]; }
  sheet() { return this.state.sheets[this.state.sheetIdx] || { front: '', back: '' }; }
  activeText() { return this.sheet()[this.state.side] || ''; }
  totalWords() { return this.state.sheets.reduce((n, s) => n + words(s.front) + words(s.back), 0); }

  setSideText(v) {
    const cap = this.limit();
    const others = this.totalWords() - words(this.activeText());
    let next = v;
    if (others + words(v) > cap) {
      const keep = Math.max(0, cap - others);
      next = v.split(/(\s+)/).reduce((acc, part) => words(acc) < keep ? acc + part : acc, '');
    }
    const trimmed = next !== v;
    this.setState(s => ({
      sheets: s.sheets.map((sh, i) => i === s.sheetIdx ? Object.assign({}, sh, { [s.side]: next }) : sh),
      docSeq: trimmed ? s.docSeq + 1 : s.docSeq,
    }));
  }

  // typed straight onto the paper — read the surface, never write back to it
  onWrite(e) {
    this.setSideText(e.currentTarget.innerText.replace(/\n$/, ''));
  }

  // pick an object up off the desk and carry it to the paper
  grabNew(e, kind) {
    e.preventDefault();
    this.setState({ hand: { kind, x: e.clientX, y: e.clientY } });
    const move = ev => this.setState(s => ({ hand: s.hand ? Object.assign({}, s.hand, { x: ev.clientX, y: ev.clientY }) : null }));
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this.setState({ hand: null });
      const surf = this.surfRef.current;
      if (!surf) return;
      const r = surf.getBoundingClientRect();
      if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return;
      const x = ((ev.clientX - r.left) / r.width) * 100;
      const y = ((ev.clientY - r.top) / r.height) * 100;
      const rot = Math.round((Math.random() - 0.5) * 26);
      this.setState(s => {
        if (kind === 'polaroid') return { polaroids: s.polaroids.concat([{ id: s.nextId, shape: 'portrait', x: x - 9, y: y - 9, rot: rot / 3, caption: '', src: '' }]), nextId: s.nextId + 1 };
        if (kind === 'own') return { stickers: s.stickers.concat([{ id: s.nextId, kind: 'own', x, y, rot: rot / 2 }]), nextId: s.nextId + 1 };
        return { stickers: s.stickers.concat([{ id: s.nextId, kind, x, y, rot }]), nextId: s.nextId + 1 };
      });
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  drag(e, id, coll) {
    e.preventDefault();
    e.stopPropagation();
    const surf = this.surfRef.current;
    if (!surf) return;
    const r = surf.getBoundingClientRect();
    const move = ev => {
      const x = Math.max(-10, Math.min(104, ((ev.clientX - r.left) / r.width) * 100));
      const y = Math.max(-10, Math.min(104, ((ev.clientY - r.top) / r.height) * 100));
      this.setState(s => ({ [coll]: s[coll].map(o => o.id === id ? Object.assign({}, o, { x, y }) : o) }));
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  copy(text) {
    try { navigator.clipboard.writeText(text); } catch (err) { /* clipboard unavailable */ }
    this.setState({ copied: true });
    setTimeout(() => this.setState({ copied: false }), 1600);
  }

  download() {
    const blob = new Blob([this.state.twText], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tidings.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  readFileIn(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const target = this.state.fileTarget;
    const fr = new FileReader();
    fr.onload = () => {
      const t = String(fr.result || '');
      if (target === 'tw') this.setState({ twText: t.slice(0, 4000) });
      else this.setSideText(t);
    };
    fr.readAsText(f);
    e.target.value = '';
  }

  ink() { return this.state.lightInk ? '#f7f5f2' : '#201e1d'; }

  word(label, go, opts) {
    const o = opts || {};
    const light = this.state.lightInk;
    return {
      label, go, title: o.title || label,
      style: {
        background: 'none', border: 0, padding: 0, cursor: 'pointer', font: 'inherit',
        fontSize: '12px', letterSpacing: '0.13em', textTransform: 'uppercase',
        textShadow: light ? '0 1px 3px rgba(0,0,0,0.55)' : 'none',
        color: o.on ? 'var(--color-accent)' : (light
          ? (o.quiet ? 'rgba(255,255,255,0.66)' : 'rgba(255,255,255,0.92)')
          : (o.quiet ? 'color-mix(in srgb, #201e1d 42%, transparent)' : 'color-mix(in srgb, #201e1d 72%, transparent)')),
      },
    };
  }

  // drop-shadow on a transparent PNG casts the object's real silhouette
  lift(mode, unit) {
    const u = unit || 'cqw';
    if (mode === 'outline') {
      const o = '0.16' + u;
      return 'drop-shadow(' + o + ' 0 #fff) drop-shadow(-' + o + ' 0 #fff) drop-shadow(0 ' + o + ' #fff) drop-shadow(0 -' + o + ' #fff) drop-shadow(0 0.2' + u + ' 0.3' + u + ' color-mix(in srgb, #201e1d 26%, transparent))';
    }
    return 'drop-shadow(0 0.3' + u + ' 0.42' + u + ' color-mix(in srgb, #201e1d 32%, transparent))';
  }

  // one drawer, six kinds of content — real objects, never swatch chips
  drawerFor(kind) {
    const s = this.state;
    const chip = (on) => ({
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '5px',
      background: 'none', border: 0, padding: '2px 0 0', cursor: 'pointer', flex: 'none',
      color: 'inherit', transition: 'transform 220ms cubic-bezier(.2,.7,.2,1)',
      opacity: on ? 1 : 0.62,
    });
    const label = (on) => ({
      fontSize: '9.5px', letterSpacing: '0.11em', textTransform: 'uppercase', whiteSpace: 'nowrap',
      textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.6)' : 'none',
      color: on ? 'var(--color-accent)' : (s.lightInk ? 'rgba(255,255,255,0.7)' : 'color-mix(in srgb, #201e1d 50%, transparent)'),
    });
    const thumb = (h, on) => ({
      display: 'block', height: h + 'px', width: 'auto', maxWidth: '120px', objectFit: 'contain',
      filter: 'drop-shadow(0 3px 5px color-mix(in srgb, #201e1d ' + (on ? 34 : 22) + '%, transparent))',
    });

    if (kind === 'paper') {
      return SURFACES[s.medium].map(p => {
        const on = p.id === s.paperId;
        return { key: p.id, src: p.img, label: p.label, title: p.label, style: chip(on), imgStyle: thumb(on ? 56 : 48, on), labelStyle: label(on), pick: () => this.setState({ paperId: p.id }) };
      });
    }
    if (kind === 'font') {
      return FONTS.map(f => {
        const on = f.id === s.fontId;
        return {
          key: f.id, src: BLANK, label: f.label, title: f.label, style: chip(on), labelStyle: label(on),
          imgStyle: { display: 'none' }, pick: () => this.setState({ fontId: f.id }),
        };
      });
    }
    if (kind === 'machine') {
      return Object.keys(MACHINES).map(id => {
        const on = id === s.machine;
        return { key: id, src: MACHINES[id].src, label: MACHINES[id].label.replace('the ', ''), title: MACHINES[id].label, style: chip(on), imgStyle: thumb(on ? 52 : 44, on), labelStyle: label(on), pick: () => this.setState({ machine: id }) };
      });
    }
    if (kind === 'envelope') {
      return ENVELOPES.map(e => {
        const on = e.id === s.envId;
        if (e.plain) return {
          key: e.id, src: BLANK, label: e.label, title: e.label, style: chip(on), labelStyle: label(on),
          imgStyle: { display: 'block', width: '68px', height: '42px', background: s.envColour, boxShadow: '0 3px 5px color-mix(in srgb, #201e1d 26%, transparent)' },
          pick: () => this.setState({ envId: e.id }),
        };
        return { key: e.id, src: e.img, label: e.label, title: e.label, style: chip(on), imgStyle: thumb(on ? 52 : 44, on), labelStyle: label(on), pick: () => this.setState({ envId: e.id }) };
      });
    }
    if (kind === 'backdrop') {
      const flats = DESKS.map((c, i) => ({
        key: 'flat' + i, src: BLANK, label: null, title: 'plain ' + c, style: chip(!s.deskBg && !s.deskSlot && s.deskIdx === i),
        imgStyle: { display: 'block', width: '54px', height: '36px', background: c, boxShadow: '0 2px 4px color-mix(in srgb, #201e1d 24%, transparent)' },
        pick: () => this.setState({ deskIdx: i, deskBg: null, deskSlot: false, lightInk: false }),
      }));
      const mine = [{
        key: 'own', src: BLANK, label: null, title: 'drop your own backdrop', style: chip(s.deskSlot),
        imgStyle: { display: 'block', width: '54px', height: '36px', outline: '1px dashed color-mix(in srgb, var(--color-accent) 60%, transparent)', outlineOffset: '-1px' },
        pick: () => this.setState({ deskSlot: true, deskBg: null }),
      }];
      return flats.concat(mine, BACKDROPS.map(b => {
        const on = s.deskBg === b.img;
        return {
          key: b.id, src: BLANK, label: null, title: b.id, style: chip(on),
          imgStyle: {
            display: 'block', width: '54px', height: '36px',
            backgroundImage: 'url(' + b.sprite + ')', backgroundSize: '324px 72px',
            backgroundPosition: '-' + b.sx + 'px -' + b.sy + 'px',
            boxShadow: on ? '0 0 0 1.5px var(--color-accent), 0 2px 4px color-mix(in srgb, #201e1d 24%, transparent)' : '0 2px 4px color-mix(in srgb, #201e1d 24%, transparent)',
          },
          pick: () => this.setState({ deskBg: b.img, deskSlot: false }),
        };
      }));
    }
    if (kind === 'sticker') {
      const items = (GROUPS[s.stickerTab] || []).map(k => {
        const o = OBJECTS[k];
        return {
          key: k, src: o.src, label: null, title: o.title + ' — drag it onto the paper',
          style: Object.assign(chip(true), { cursor: 'grab', touchAction: 'none' }),
          imgStyle: { display: 'block', height: o.w > 14 ? '28px' : '34px', width: 'auto', filter: this.lift('shadow', 'px') },
          grab: e => this.grabNew(e, k),
        };
      });
      const extras = [
        { key: 'polaroid', src: BLANK, label: null, title: 'a polaroid — drag it onto the paper', style: Object.assign(chip(true), { cursor: 'grab', touchAction: 'none' }), imgStyle: { display: 'block', width: '27px', height: '33px', background: '#fbfaf8', boxShadow: 'inset 0 0 0 3px #fbfaf8, inset 0 0 0 4px #d8d3ce, 0 3px 4px color-mix(in srgb, #201e1d 26%, transparent)' }, grab: e => this.grabNew(e, 'polaroid') },
        { key: 'own', src: BLANK, label: null, title: 'drop in your own cut-out', style: Object.assign(chip(true), { cursor: 'grab', touchAction: 'none' }), imgStyle: { display: 'block', width: '27px', height: '27px', outline: '1px dashed color-mix(in srgb, var(--color-accent) 60%, transparent)', outlineOffset: '2px' }, grab: e => this.grabNew(e, 'own') },
      ];
      return items.concat(extras);
    }
    return [];
  }

  renderVals() {
    const s = this.state;
    const p = this.paper();
    const F = this.font();
    const env = this.envelope();
    const ink = s.lightInk && false ? '#f7f5f2' : ((this.props && this.props.letterInk) || '#201e1d');
    const chrome = s.lightInk ? 'rgba(255,255,255,0.92)' : '#201e1d';
    const cap = this.limit();
    const tw = this.totalWords();
    const isS3 = s.screen === 3, isS4 = s.screen === 4, isS5 = s.screen === 5;
    const isDesk = s.screen >= 3 && s.screen <= 5;
    const askEnvelope = isS4 && s.medium === 'postcard' && !s.envAsked;
    const canFlip = !!(this.sheet().back || '').trim();
    const opened = s.opened || !s.envOn;
    const rule = (p.lh * 0.755).toFixed(3);
    // type never sets below 11px: the sheet may shrink with a short window, the
    // reading size may not. Rules take the same floor so they stay in register.
    const MINFS = 11;
    const fsC = p.fs * F.k;
    const lhPx = MINFS * p.lh / fsC;
    const FS = 'max(' + MINFS + 'px, ' + fsC.toFixed(3) + 'cqw)';
    const LH = 'max(' + lhPx.toFixed(2) + 'px, ' + p.lh.toFixed(4) + 'cqw)';
    const RULE = 'max(' + (lhPx * 0.755).toFixed(2) + 'px, ' + rule + 'cqw)';
    const INK22 = 'color-mix(in srgb, ' + ink + ' 22%, transparent)';
    const rulesBg = 'repeating-linear-gradient(to bottom, transparent 0, transparent calc(' + RULE + ' - 1px), ' + INK22 + ' calc(' + RULE + ' - 1px), ' + INK22 + ' ' + RULE + ', transparent ' + RULE + ', transparent ' + LH + ')';
    // the element IS the text area (insets, no padding) so overflow columns are
    // clipped outside it; column-* is only set when the surface really has leaves
    const textBase = {
      position: 'absolute', zIndex: 2, border: 0, outline: 'none', background: 'none',
      top: p.pad[0] + 'cqw', right: p.pad[1] + 'cqw', bottom: p.pad[2] + 'cqw', left: p.pad[3] + 'cqw',
      overflow: p.cols > 1 ? 'hidden' : 'auto', overscrollBehavior: 'contain', scrollbarWidth: 'thin',
      whiteSpace: 'pre-wrap',
      fontFamily: F.css,
      fontSize: FS, lineHeight: LH, color: ink,
      caretColor: 'var(--color-accent)',
    };
    if (p.cols > 1) {
      textBase.columnCount = p.cols;
      textBase.columnGap = (p.gap || 0) + 'cqw';
      textBase.columnFill = 'auto';
    }
    const polSize = { portrait: [18, 1.25], landscape: [24, 0.72], square: [20, 1] };
    const MACH = MACHINES[s.machine] || MACHINES.olympia;
    const KEY_MAP = keyMapFor(s.machine);
    const stampPick = (STAMPS[s.country] || [])[s.stampIdx] || STAMPS.JAPAN[0];
    const stampObj = { src: (OBJECTS[stampPick.obj] || OBJECTS.stampNippon).src, value: stampPick.value };
    const drawerKind = s.drawer;

    const menu = (id, label) => this.word(label, () => this.setState(v => ({ drawer: v.drawer === id ? null : id })), { on: s.drawer === id, quiet: s.drawer !== id, title: label });

    const wordList = [];
    if (isS3) {
      wordList.push(menu('paper', s.medium === 'diary' ? 'the book' : 'the paper'));
      wordList.push(menu('sticker', 'things'));
      wordList.push(menu('font', 'the hand'));
      wordList.push(menu('backdrop', 'the desk'));
      wordList.push(this.word(canFlip || s.side === 'back' ? 'turn over' : 'write on the back', () => this.setState(v => ({ side: v.side === 'front' ? 'back' : 'front' })), { quiet: true }));
      if (s.full) wordList.push(this.word('this sheet is full — carry on over the page', () => this.setState(v => ({ sheets: v.sheets.concat([{ front: '', back: '' }]), sheetIdx: v.sheets.length, side: 'front' })), { title: 'add a page and keep writing' }));
      if (s.sheets.length > 1) wordList.push(this.word('‹ page', () => this.setState(v => ({ sheetIdx: Math.max(0, v.sheetIdx - 1), side: 'front' })), { quiet: true, title: 'the page before' }));
      if (s.sheets.length > 1) wordList.push(this.word('page ›', () => this.setState(v => ({ sheetIdx: Math.min(v.sheets.length - 1, v.sheetIdx + 1), side: 'front' })), { quiet: true, title: 'the next page' }));
      wordList.push(this.word('add a page', () => this.setState(v => ({ sheets: v.sheets.concat([{ front: '', back: '' }]), sheetIdx: v.sheets.length, side: 'front' })), { quiet: true }));
      wordList.push(this.word(s.signature ? 'unsign' : 'sign it', () => this.setState(v => ({ signature: !v.signature })), { quiet: true, on: s.signature }));
      wordList.push(this.word(s.stickerMode === 'outline' ? 'white outline' : 'drop shadow', () => this.setState(v => ({ stickerMode: v.stickerMode === 'outline' ? 'shadow' : 'outline' })), { quiet: true, title: 'how the objects sit on the paper' }));
      wordList.push(this.word(s.lightInk ? 'dark ink' : 'light ink', () => this.setState(v => ({ lightInk: !v.lightInk })), { quiet: true, title: 'the chrome, over a dark backdrop' }));
      wordList.push(this.word('spell check', () => this.setState(v => ({ spell: !v.spell })), { quiet: true, on: s.spell }));
      wordList.push(this.word('done', () => this.setState({ screen: s.medium === 'postcard' ? 4 : 5, opened: false, flipped: false, drawer: null, side: 'front' }), { on: true }));
    }
    if (isS4 && !askEnvelope) {
      if (s.full) wordList.push(this.word('the writing runs off this sheet — add a page', () => this.setState(v => ({ screen: 3, drawer: null, sheets: v.sheets.concat([{ front: '', back: '' }]), sheetIdx: v.sheets.length, side: 'front' })), { title: 'back to the writing, on a fresh page' }));
      if (s.envOn) wordList.push(menu('envelope', 'the envelope'));
      wordList.push(this.word('keep writing', () => this.setState({ screen: 3, drawer: null }), { quiet: true }));
      wordList.push(this.word(s.copied ? 'link copied' : 'copy the link', () => this.copy('https://tidings.letters/r/7f42a9'), { quiet: true }));
      wordList.push(this.word('send it', () => this.setState({ screen: 5, opened: false, flipped: false, drawer: null }), { on: true }));
    }
    if (isS5) {
      if (s.full) wordList.push(this.word('the writing runs off this sheet — add a page', () => this.setState(v => ({ screen: 3, drawer: null, sheets: v.sheets.concat([{ front: '', back: '' }]), sheetIdx: v.sheets.length, side: 'front' })), { title: 'back to the writing, on a fresh page' }));
      wordList.push(this.word(s.copied ? 'link copied' : 'copy the link', () => this.copy('https://tidings.letters/r/7f42a9'), { quiet: true }));
      ['whatsapp', 'mail', 'messages'].forEach(t => wordList.push(this.word(t, () => this.copy('https://tidings.letters/r/7f42a9'), { quiet: true })));
      wordList.push(this.word('seal it again', () => this.setState({ opened: false, flipped: false, side: 'front' }), { quiet: true }));
    }
    if (s.screen === 6) {
      wordList.push(menu('machine', 'the machine'));
      wordList.push(this.word('the sheet', () => this.setState(v => ({ twSheet: (v.twSheet + 1) % MACHINE_SHEETS.length })), { quiet: true, title: 'what is in the platen' }));
      wordList.push(this.word('open a file', () => { this.setState({ fileTarget: 'tw' }); if (this.fileRef.current) this.fileRef.current.click(); }, { quiet: true }));
      wordList.push(this.word('spell check', () => this.setState(v => ({ spell: !v.spell })), { quiet: true, on: s.spell }));
      wordList.push(this.word('send as a letter', () => this.setState(v => ({ screen: 3, medium: 'page', paperId: 'cream', sheets: [{ front: v.twText, back: '' }], sheetIdx: 0, side: 'front', drawer: null })), { quiet: true }));
      wordList.push(this.word('done', () => this.setState({ screen: 7, drawer: null }), { on: true }));
    }
    if (s.screen === 7) {
      wordList.push(this.word('download the file', () => this.download(), { quiet: true }));
      wordList.push(this.word(s.copied ? 'copied' : 'copy the text', () => this.copy(s.twText), { quiet: true }));
      wordList.push(this.word('send as a letter', () => this.setState(v => ({ screen: 3, medium: 'page', paperId: 'cream', sheets: [{ front: v.twText, back: '' }], sheetIdx: 0, side: 'front' })), { on: true }));
    }

    const drawerNotes = {
      paper: 'click to change what you are writing on',
      sticker: 'drag anything onto the paper · double-click to take it off',
      font: 'the hand it is written in',
      backdrop: 'forty-seven of them',
      envelope: 'what it travels in',
      machine: 'eight machines, each with its own keys',
    };
    const drawerTitles = { paper: s.medium === 'diary' ? 'the book' : 'the paper', sticker: 'things', font: 'the hand', backdrop: 'the desk', envelope: 'the envelope', machine: 'the machine' };

    return {
      isS1: s.screen === 1, isS2: s.screen === 2, isS4, isS5, isS6: s.screen === 6, isS7: s.screen === 7,
      isDesk, isTypewriter: s.screen === 6 || s.screen === 7,
      shellStyle: {
        height: '100dvh', display: 'grid', gridTemplateRows: 'auto minmax(0, 1fr) auto', gridTemplateColumns: 'minmax(0, 1fr)', overflow: 'hidden',
        background: s.deskBg || s.deskSlot ? 'transparent' : DESKS[s.deskIdx],
        color: chrome, fontFamily: 'var(--font-body)', position: 'relative',
      },
      deskImgStyle: s.deskBg ? { position: 'fixed', inset: 0, zIndex: 0, backgroundImage: 'url(' + s.deskBg + ')', backgroundSize: 'cover', backgroundPosition: 'center' } : null,
      deskSlot: s.deskSlot,
      markStyle: { background: 'none', border: 0, padding: 0, cursor: 'pointer', fontFamily: 'var(--font-heading)', fontSize: '15px', letterSpacing: '0.22em', textTransform: 'uppercase', color: chrome, textShadow: s.lightInk ? '0 1px 4px rgba(0,0,0,0.5)' : 'none' },
      quietStyle: { background: 'none', border: 0, padding: 0, cursor: 'pointer', font: 'inherit', fontSize: '13px', fontStyle: 'italic', color: s.lightInk ? 'rgba(255,255,255,0.7)' : 'color-mix(in srgb, #201e1d 52%, transparent)', textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.5)' : 'none' },
      topRightStyle: { fontSize: '12px', letterSpacing: '0.14em', textTransform: 'uppercase', color: s.lightInk ? 'rgba(255,255,255,0.7)' : 'color-mix(in srgb, #201e1d 45%, transparent)', textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.5)' : 'none' },
      hintStyle: { fontSize: '13px', fontStyle: 'italic', color: s.lightInk ? 'rgba(255,255,255,0.8)' : 'color-mix(in srgb, #201e1d 55%, transparent)', textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.5)' : 'none', animation: 'tdFade 600ms ease both' },
      selectStyle: { background: 'none', border: 0, padding: 0, cursor: 'pointer', fontSize: '12px', letterSpacing: '0.13em', textTransform: 'uppercase', color: s.lightInk ? 'rgba(255,255,255,0.66)' : 'color-mix(in srgb, #201e1d 55%, transparent)' },
      fieldRef: this.fieldRef,
      fieldStyle: { position: 'relative', minHeight: 0, overflow: isDesk ? 'auto' : 'hidden', containerType: 'size', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', zIndex: 1 },

      restart: () => this.setState({ screen: 1, opened: false, flipped: false, envOn: false, envAsked: false, drawer: null }),
      backWord: s.screen === 1 ? null : (isS3 ? 'start again' : 'back'),
      back: () => this.setState(v => ({ drawer: null, screen: v.screen === 2 ? 1 : (v.screen === 3 ? 2 : (v.screen === 7 ? 6 : (v.screen === 6 ? 1 : 3))) })),
      topRight: isS3 ? 'sheet ' + (s.sheetIdx + 1) + ' of ' + s.sheets.length + ' · ' + s.side : (isS5 ? 'as your reader sees it' : null),

      pickLetterPath: () => this.setState({ screen: 2 }),
      pickTypewriterPath: () => this.setState({ screen: 6 }),
      pickDiary: () => this.setState({ medium: 'diary', paperId: 'dot', screen: 3, envOn: false, envAsked: false, side: 'front' }),
      pickPage: () => this.setState({ medium: 'page', paperId: 'cream', screen: 3, envOn: false, envAsked: false, side: 'front' }),
      pickPostcard: () => this.setState({ medium: 'postcard', paperId: 'cream', screen: 3, envOn: false, envAsked: false, side: 'front' }),

      askEnvelope,
      envYes: () => this.setState({ envAsked: true, envOn: true }),
      envNo: () => this.setState({ envAsked: true, envOn: false }),

      showLetter: isS3 || (isS4 && !askEnvelope) || (isS5 && opened),
      editable: isS3,
      readOnly: !isS3,
      surfaceStyle: {
        position: 'relative', flex: 'none',
        minWidth: Math.min(p.maxW, Math.round(MINFS * 100 / fsC)) + 'px',
        width: 'min(100%, ' + p.maxW + 'px, calc((' + (((isS4 || isS5) && s.envOn) ? 34 : 100) + 'cqh - 40px) / ' + p.aspect + '))',
        aspectRatio: '1 / ' + p.aspect,
        containerType: 'inline-size',
        filter: p.cut
          ? 'drop-shadow(0 24px 30px color-mix(in srgb, #201e1d 18%, transparent)) drop-shadow(0 3px 5px color-mix(in srgb, #201e1d 13%, transparent))'
          : 'drop-shadow(0 22px 30px color-mix(in srgb, #201e1d 15%, transparent)) drop-shadow(0 2px 4px color-mix(in srgb, #201e1d 12%, transparent))',
        cursor: isS5 && canFlip ? 'pointer' : 'default',
        animation: isS5 ? 'tdRise 700ms cubic-bezier(.2,.7,.2,1) both' : (s.flipping ? 'tdFlip 520ms ease-in-out both' : 'none'),
      },
      paper: p,
      paperImgStyle: p.crop ? {
        position: 'absolute', left: 0, top: 0, right: 0, bottom: 0,
        backgroundImage: 'url(' + p.img + ')', backgroundRepeat: 'no-repeat',
        backgroundSize: p.crop.w + 'cqw ' + p.crop.w + 'cqw',
        backgroundPosition: p.crop.l + 'cqw ' + p.crop.t + 'cqw',
      } : {
        position: 'absolute', inset: 0,
        backgroundImage: 'url(' + p.img + ')', backgroundRepeat: 'no-repeat', backgroundPosition: 'center',
        backgroundSize: p.fit === 'cover' ? 'cover' : '100% 100%',
      },
      drawnRules: p.rule === 'drawn',
      rulesStyle: { position: 'absolute', zIndex: 1, pointerEvents: 'none', top: p.pad[0] + 'cqw', right: p.pad[1] + 'cqw', bottom: p.pad[2] + 'cqw', left: p.pad[3] + 'cqw', background: rulesBg },
      marginRuleStyle: { position: 'absolute', zIndex: 1, top: '2cqw', bottom: '2cqw', left: (p.margin || 0) + 'cqw', width: '1px', background: 'color-mix(in srgb, var(--color-accent-2) 70%, transparent)', pointerEvents: 'none' },
      cardLines: !!p.card && !p.noLines,
      cardDividerStyle: { position: 'absolute', zIndex: 1, top: '8cqw', bottom: '7cqw', left: '50cqw', width: '1px', background: 'color-mix(in srgb, ' + ink + ' 28%, transparent)' },
      cardAddressStyle: { position: 'absolute', zIndex: 1, left: '56cqw', right: '7cqw', top: '28cqw' },

      writeRef: this.writeRef,
      onWrite: e => this.onWrite(e),
      writeStyle: Object.assign({}, textBase, { cursor: 'text' }),
      readStyle: Object.assign({}, textBase, { pointerEvents: 'none' }),
      shownText: s.flipping ? '' : this.activeText(),
      spell: s.spell,
      surfRef: this.surfRef,
      surfaceClick: () => {
        if (isS5 && canFlip && !s.flipping) {
          this.setState({ flipping: true });
          setTimeout(() => this.setState(v => ({ side: v.side === 'front' ? 'back' : 'front', flipped: true })), 250);
          setTimeout(() => this.setState({ flipping: false }), 540);
        }
      },

      stickers: s.stickers.map(k => {
        const o = OBJECTS[k.kind];
        const base = {
          position: 'absolute', zIndex: 4, left: k.x + '%', top: k.y + '%',
          transform: 'translate(-50%, -50%) rotate(' + (k.rot || 0) + 'deg)',
          cursor: 'grab', touchAction: 'none', userSelect: 'none',
        };
        const common = {
          grab: e => this.drag(e, k.id, 'stickers'),
          remove: () => this.setState(v => ({ stickers: v.stickers.filter(q => q.id !== k.id) })),
        };
        if (!o) return Object.assign(common, { src: BLANK, style: Object.assign(base, { display: 'block', width: '13cqw', height: '13cqw', outline: '1px dashed color-mix(in srgb, var(--color-accent) 55%, transparent)', outlineOffset: '2px' }) });
        return Object.assign(common, {
          src: o.src,
          style: Object.assign(base, {
            display: 'block', width: o.w + 'cqw', height: 'auto',
            filter: this.lift(k.mode || s.stickerMode, 'cqw'),
          }),
        });
      }),

      polaroids: s.polaroids.map(o => {
        const dim = polSize[o.shape] || polSize.square;
        return {
          slotId: 'tidings-polaroid-' + o.id,
          caption: o.caption, src: o.src || '',
          grab: e => this.drag(e, o.id, 'polaroids'),
          setCaption: e => { const val = e.target.value; this.setState(v => ({ polaroids: v.polaroids.map(q => q.id === o.id ? Object.assign({}, q, { caption: val }) : q) })); },
          frameStyle: { position: 'absolute', zIndex: 5, left: o.x + '%', top: o.y + '%', width: dim[0] + 'cqw', transform: 'rotate(' + (o.rot || 0) + 'deg)', background: '#fbfaf8', padding: '0.9cqw 0.9cqw 0', filter: 'drop-shadow(0 0.5cqw 0.9cqw color-mix(in srgb, #201e1d 26%, transparent))' },
          gripStyle: { position: 'absolute', inset: '-0.9cqw -0.9cqw auto', height: '1.9cqw', cursor: 'grab', touchAction: 'none' },
          photoStyle: { position: 'relative', width: '100%', aspectRatio: '1 / ' + dim[1], background: '#e3e1de' },
          captionStyle: { width: '100%', border: 0, outline: 'none', background: 'none', textAlign: 'center', fontFamily: "'Courier Prime', ui-monospace, monospace", fontSize: '1.05cqw', lineHeight: 1.1, padding: '0.7cqw 0 1.1cqw', color: '#201e1d' },
        };
      }),

      signature: s.signature,
      sigStyle: { position: 'absolute', zIndex: 5, right: (p.pad[1] + 1) + 'cqw', bottom: (p.pad[2] + 1) + 'cqw', width: '22cqw', height: '7cqw', mixBlendMode: 'multiply' },

      drawer: drawerKind,
      drawerTitle: drawerKind ? drawerTitles[drawerKind] : null,
      drawerNote: drawerKind ? drawerNotes[drawerKind] : null,
      drawerTitleStyle: { fontSize: '11px', letterSpacing: '0.18em', textTransform: 'uppercase', color: s.lightInk ? 'rgba(255,255,255,0.9)' : 'color-mix(in srgb, #201e1d 70%, transparent)', textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.5)' : 'none' },
      drawerNoteStyle: { fontSize: '12px', fontStyle: 'italic', color: s.lightInk ? 'rgba(255,255,255,0.62)' : 'color-mix(in srgb, #201e1d 45%, transparent)', textShadow: s.lightInk ? '0 1px 3px rgba(0,0,0,0.5)' : 'none' },
      drawerStyle: {
        display: 'flex', alignItems: 'flex-end', gap: drawerKind === 'backdrop' ? '8px' : '16px',
        flexWrap: (drawerKind === 'backdrop' || drawerKind === 'sticker') ? 'wrap' : 'nowrap',
        maxHeight: (drawerKind === 'backdrop' || drawerKind === 'sticker') ? '112px' : 'none',
        overflowX: 'auto', overflowY: (drawerKind === 'backdrop' || drawerKind === 'sticker') ? 'auto' : 'hidden',
        minWidth: 0, padding: '2px 2px 12px',
      },
      drawerItems: this.drawerFor(drawerKind),
      drawerTabs: drawerKind === 'sticker'
        ? STICKER_TABS.map(t => this.word(t.label, () => this.setState({ stickerTab: t.id }), { on: s.stickerTab === t.id, quiet: s.stickerTab !== t.id }))
        : [],

      hand: s.hand ? { src: (OBJECTS[s.hand.kind] || {}).src || BLANK } : null,
      handStyle: s.hand ? Object.assign(
        { position: 'fixed', left: s.hand.x + 'px', top: s.hand.y + 'px', zIndex: 90, pointerEvents: 'none', display: 'block' },
        s.hand.kind === 'polaroid' ? { width: '36px', height: '44px', background: '#fbfaf8', boxShadow: 'inset 0 0 0 4px #fbfaf8, inset 0 0 0 5px #d8d3ce', transform: 'translate(-50%, -50%)' }
          : s.hand.kind === 'own' ? { width: '36px', height: '36px', outline: '1px dashed var(--color-accent)', transform: 'translate(-50%, -50%)' }
            : { height: (OBJECTS[s.hand.kind] && OBJECTS[s.hand.kind].w > 14) ? '40px' : '46px', width: 'auto', transform: 'translate(-50%, -50%) rotate(-6deg)', filter: this.lift('shadow', 'px') }
      ) : null,

      // — envelope —
      showEnvelope: (isS4 && s.envOn && !askEnvelope) || (isS5 && s.envOn),
      envWrapStyle: { flex: 'none', width: 'min(100%, ' + (env.plain ? 560 : 470) + 'px, calc((' + (s.drawer ? 34 : 48) + 'cqh - 24px) / ' + env.aspect + '))', minWidth: '210px', transition: 'transform 700ms cubic-bezier(.2,.7,.2,1)', transform: isS5 && s.opened ? 'translateY(10px)' : 'translateY(0)' },
      envStyle: {
        position: 'relative', width: '100%', aspectRatio: '1 / ' + env.aspect,
        background: env.plain ? s.envColour : 'transparent',
        containerType: 'inline-size', fontSize: '14px',
        filter: 'drop-shadow(0 18px 26px color-mix(in srgb, #201e1d 17%, transparent)) drop-shadow(0 2px 4px color-mix(in srgb, #201e1d 13%, transparent))',
        cursor: isS5 && !s.opened ? 'pointer' : 'default',
      },
      envImgStyle: env.plain ? null : { position: 'absolute', inset: 0, zIndex: 1, backgroundImage: 'url(' + env.img + ')', backgroundSize: 'contain', backgroundPosition: 'center', backgroundRepeat: 'no-repeat' },
      envFlapStyle: env.plain ? { position: 'absolute', left: 0, top: 0, right: 0, height: '63%', clipPath: 'polygon(0 0, 100% 0, 50% 100%)', background: 'linear-gradient(180deg, color-mix(in srgb, #201e1d 5%, transparent) 0%, color-mix(in srgb, #201e1d 11%, transparent) 100%)', zIndex: 2 } : null,
      envAddrStyle: env.addr ? { position: 'absolute', left: env.addr[0] + '%', top: env.addr[1] + '%', width: env.addr[2] + '%', zIndex: 3, color: '#201e1d' } : null,
      envelopeClick: () => { if (isS5 && !s.opened) this.setState({ opened: true }); },
      envStamp: s.stampIdx >= 0 ? { img: stampObj.src } : null,
      envStampStyle: { position: 'absolute', right: env.stamp[0] + '%', top: env.stamp[1] + '%', width: env.stamp[2] + '%', zIndex: 4, transform: 'rotate(2deg)', filter: 'drop-shadow(0 2px 3px color-mix(in srgb, #201e1d 26%, transparent))' },
      envSealSrc: (OBJECTS[s.seal] || OBJECTS.sealSun).src,
      envSealStyle: s.seal === 'none' ? null : {
        position: 'absolute', left: env.seal[0] + '%', top: env.seal[1] + '%', transform: 'translate(-50%, -50%)', zIndex: 5,
        width: env.seal[2] + '%', height: 'auto', filter: 'drop-shadow(0 3px 5px color-mix(in srgb, #201e1d 30%, transparent))',
      },

      showColours: isS4 && s.envOn && !askEnvelope && env.plain,
      envColour: s.envColour,
      envColours: ['#f7f5f2', '#efece7', '#e2ded7', '#d8d5d2', '#cfe3ea', '#f2dbe6'].map(c => ({
        title: c, pick: () => this.setState({ envColour: c }),
        style: { display: 'block', width: '22px', height: '22px', borderRadius: '50%', background: c, cursor: 'pointer', boxShadow: s.envColour === c ? '0 0 0 1.5px var(--color-accent), 0 1px 2px color-mix(in srgb, #201e1d 24%, transparent)' : '0 1px 2px color-mix(in srgb, #201e1d 24%, transparent)' },
      })),
      setEnvColour: e => this.setState({ envColour: e.target.value }),
      countries: Object.keys(STAMPS),
      country: s.country,
      setCountry: e => this.setState({ country: e.target.value, stampIdx: 0 }),
      stamps: (STAMPS[s.country] || []).map((st, i) => ({
        img: (OBJECTS[st.obj] || OBJECTS.stampNippon).src, title: s.country + ' ' + st.value,
        pick: () => this.setState({ stampIdx: i }),
        style: { display: 'block', width: '24px', height: 'auto', cursor: 'pointer', opacity: s.stampIdx === i ? 1 : 0.42, filter: 'drop-shadow(0 2px 3px color-mix(in srgb, #201e1d 24%, transparent))' },
      })),

      centreHint: isS5 && !opened ? 'click the envelope' : (isS5 && opened && canFlip && !s.flipped ? 'something is written on the back — click the paper' : (isS3 && !s.drawer ? 'open a drawer below · drag things onto the paper' : null)),

      // — typewriter —
      // the sheet is fed up out of the platen: the machine sits over its bottom edge
      machineStyle: { position: 'absolute', inset: 0, backgroundImage: 'url(' + MACH.src + ')', backgroundSize: '100% 100%', filter: 'drop-shadow(0 14px 22px color-mix(in srgb, #201e1d 16%, transparent))' },
      twSheetStyle: { position: 'absolute', inset: 0, backgroundImage: 'url(' + (MACHINE_SHEETS[s.twSheet] || MACHINE_SHEETS[0]) + ')', backgroundSize: 'cover', backgroundPosition: 'center' },
      twAssemblyStyle: {
        position: 'relative', flex: 'none', minWidth: '320px', margin: 'auto 0',
        width: s.screen === 6
          ? 'min(100%, 680px, max(360px, calc(100cqh / ' + MACH.asm + ')))'
          : 'min(100%, 720px, max(480px, calc(100cqh / 0.5)))',
        aspectRatio: s.screen === 6 ? '1 / ' + MACH.asm : '1 / 0.5',
      },
      sheetStyle: s.screen === 6 ? {
        position: 'absolute', top: 0, left: MACH.sheet.left + '%', width: MACH.sheet.width + '%',
        aspectRatio: '1 / ' + MACH.sheet.aspect,
        containerType: 'inline-size', zIndex: 2, overflow: 'hidden',
        filter: 'drop-shadow(0 0.5cqw 1.1cqw color-mix(in srgb, #201e1d 16%, transparent))',
      } : {
        position: 'absolute', inset: 0, containerType: 'inline-size', zIndex: 2, overflow: 'hidden',
        filter: 'drop-shadow(0 0.4cqw 1.2cqw color-mix(in srgb, #201e1d 18%, transparent))',
      },
      // contact shading where the paper disappears behind the roller
      feedShadeStyle: s.screen === 6 ? {
        position: 'absolute', left: 0, right: 0, bottom: 0, height: (MACH.sheet.bottom + 6) + 'cqw',
        zIndex: 3, pointerEvents: 'none',
        background: 'linear-gradient(to top, color-mix(in srgb, #201e1d 30%, transparent) 0%, color-mix(in srgb, #201e1d 9%, transparent) 42%, transparent 100%)',
      } : null,
      machineWrapStyle: { position: 'absolute', left: 0, bottom: 0, width: '100%', aspectRatio: '1 / ' + MACH.machineAspect, zIndex: 4 },
      twWriteStyle: {
        position: 'absolute', left: '9cqw', right: '9cqw', top: MACH.sheet.top + 'cqw', bottom: MACH.sheet.bottom + 'cqw',
        border: 0, outline: 'none', background: 'none', resize: 'none', overflow: 'hidden',
        fontFamily: F.css,
        fontSize: 'max(10px, ' + (1.75 * F.k).toFixed(2) + 'cqw)', lineHeight: 'max(14px, 2.6cqw)', letterSpacing: '0.01em',
        color: ink, caretColor: 'var(--color-accent)', whiteSpace: 'pre-wrap',
      },
      twReadStyle: {
        position: 'absolute', left: '9cqw', right: '9cqw', top: '5cqw', bottom: '4cqw',
        fontFamily: F.css,
        fontSize: 'max(11px, ' + (1.55 * F.k).toFixed(2) + 'cqw)', lineHeight: 'max(15px, 2.3cqw)', letterSpacing: '0.01em',
        color: ink, whiteSpace: 'pre-wrap', overflow: 'hidden',
      },
      twText: s.twText,
      twRef: this.twRef,
      setTwText: e => this.setState({ twText: e.target.value }),
      keyMarks: Object.keys(KEY_MAP).filter(k => k === s.pressed).map(k => ({
        style: {
          position: 'absolute', zIndex: 3, left: KEY_MAP[k].x + '%', top: KEY_MAP[k].y + '%',
          transform: 'translate(-50%, -50%)',
          width: KEY_MAP[k].wide ? MACH.space.w + '%' : MACH.keyW + '%', height: KEY_MAP[k].wide ? MACH.space.h + '%' : 'auto',
          aspectRatio: KEY_MAP[k].wide ? 'auto' : '1', borderRadius: KEY_MAP[k].wide ? '3px' : '50%',
          background: 'color-mix(in srgb, var(--color-accent) 38%, transparent)',
          boxShadow: '0 0 12px color-mix(in srgb, var(--color-accent) 55%, transparent)',
          pointerEvents: 'none',
        },
      })),

      words: wordList,
      showFormats: isS3 || s.screen === 6,
      formats: FORMATS,
      format: s.format,
      setFormat: e => {
        const f = e.target.value;
        this.setState({ format: f });
        if (s.screen === 6) this.setState({ twText: SKELETONS[f] || '' });
        else this.setSideText(SKELETONS[f] || '');
      },
      counter: isS3 ? tw + ' / ' + cap : (s.screen === 6 || s.screen === 7 ? words(s.twText) + ' words' : null),
      counterStyle: { marginLeft: 'auto', fontSize: '12px', letterSpacing: '0.1em', fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap', color: tw >= cap ? 'var(--color-accent-2)' : (s.lightInk ? 'rgba(255,255,255,0.6)' : 'color-mix(in srgb, #201e1d 40%, transparent)') },

      fileRef: this.fileRef,
      readFile: e => this.readFileIn(e),
    };
  }
}

</script>
